kind: pipeline
type: docker
name: ci

steps:
  - name: install
    image: node:20
    commands:
      - npm ci

  - name: lint
    image: node:20
    commands:
      - npm run lint
    depends_on: [install]

  - name: test
    image: node:20
    commands:
      - npm test
    depends_on: [install]

  - name: build
    image: node:20
    commands:
      - npm run build
    depends_on: [lint, test]

# Placeholder until cv-infra outputs the bucket/distribution IDs:
# a deploy step syncs dist/ to S3 and invalidates CloudFront on main.
