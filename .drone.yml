kind: pipeline
type: docker
name: ci

trigger:
  event: [push, pull_request]

# Steps run sequentially on purpose: the Drone runner lives on a Free Tier
# t3.micro (1 GB RAM + swap), and parallel node containers OOM it.

steps:
  - name: install
    image: node:20
    commands:
      - npm ci

  - name: lint
    image: node:20
    commands:
      - npm run lint
    depends_on: [install]

  - name: typecheck
    image: node:20
    commands:
      - npm run typecheck
    depends_on: [lint]

  - name: test
    image: node:20
    commands:
      - npm test
    depends_on: [typecheck]

  # VITE_* values are baked in at build time (none are secrets). The empty
  # VITE_DOMAIN_SERVICE_URL makes API calls same-origin, served by
  # CloudFront's /api/* behavior — it must be exported in commands because
  # Drone silently drops empty-string values from the environment block,
  # which let the localhost fallback into a deployed bundle once.
  - name: build
    image: node:20
    environment:
      VITE_COGNITO_USER_POOL_ID: eu-west-3_0pjSduVeP
      VITE_COGNITO_CLIENT_ID: 9pd7rt69u0072dtg0lbjpqq0q
      VITE_COGNITO_HOSTED_UI_DOMAIN: cv-project-dev.auth.eu-west-3.amazoncognito.com
    commands:
      - export VITE_DOMAIN_SERVICE_URL=""
      - npm run build
    depends_on: [test]

  # Compiles every story; catches stories drifting from component props.
  # Storybook itself is not deployed anywhere — this is a build gate only.
  - name: build-storybook
    image: node:20
    commands:
      - npm run build-storybook
    depends_on: [build]

  # PRs stop at build; the merge commit landing on master deploys. Bucket and
  # distribution come from cv-infra outputs (frontend_bucket_name,
  # frontend_cloudfront_distribution_id); this app owns the /admin/ prefix of
  # the shared frontend bucket (vite base and the CloudFront spa-router agree).
  # Secrets are the cv-project-drone-deploy IAM user's access key, set in the
  # Drone UI for this repo.
  - name: deploy
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_DEFAULT_REGION: eu-west-3
    commands:
      - aws s3 sync dist/ s3://cv-project-frontend-dev/admin/ --delete
      - aws cloudfront create-invalidation --distribution-id E2AV0INGJW1UO2 --paths "/admin/*"
    depends_on: [build-storybook]
    when:
      branch: [master]
      event: [push]
