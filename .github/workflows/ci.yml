name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege by default; only the deploy job widens this (OIDC token).
permissions:
  contents: read

# Superseded PR runs of the same ref are cancelled. Master runs are never
# cancelled by this group (a later run just waits for the earlier one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # VITE_* values are baked in at build time (none are secrets). The empty
      # VITE_DOMAIN_SERVICE_URL makes API calls same-origin, served by
      # CloudFront's /api/* behavior. It must stay explicitly empty: unset, the
      # src/store.ts `??` fallback puts http://localhost:8080 in the bundle.
      # The guard below fails the run if that ever happens.
      - name: Build
        env:
          VITE_COGNITO_USER_POOL_ID: eu-west-3_0pjSduVeP
          VITE_COGNITO_CLIENT_ID: 9pd7rt69u0072dtg0lbjpqq0q
          VITE_COGNITO_HOSTED_UI_DOMAIN: cv-project-dev.auth.eu-west-3.amazoncognito.com
          VITE_DOMAIN_SERVICE_URL: ""
        run: npm run build

      - name: Fail if dist/ references localhost:8080
        run: |
          if grep -rn "localhost:8080" dist/; then
            echo "::error::dist/ contains localhost:8080 — the bundle would call the visitor's machine"
            exit 1
          fi

      # Compiles every story; catches stories drifting from component props.
      # Storybook is a build gate only, not deployed.
      - run: npm run build-storybook

      - name: Structural tests (workflows)
        run: |
          python3 -c 'import yaml' || pip install --user pyyaml
          python3 -m unittest discover -s scripts/tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Publishes the tested dist/ to the admin/ prefix of the shared frontend
  # bucket (vite base and the CloudFront spa-router agree on /admin/).
  # No `environment:` here on purpose: it would change the OIDC subject, and
  # the deploy role trusts exactly repo:erfeamor/cv-admin-react:ref:refs/heads/master.
  # The role can only write/delete under admin/ and create invalidations; it
  # cannot read objects, so nothing below reads from S3.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC -> sts:AssumeRoleWithWebIdentity
      contents: read
    # Never run two deploys against the bucket at once. A running deploy is never
    # cancelled; GitHub keeps only one pending run per group, so a newer push
    # replaces a queued (not yet started) one and the last deploy is always the
    # latest commit.
    concurrency:
      group: deploy-cv-admin-react
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-3
      S3_BUCKET: cv-project-frontend-dev
      CLOUDFRONT_DISTRIBUTION_ID: E2AV0INGJW1UO2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Fail if dist/ references localhost:8080
        run: |
          if grep -rn "localhost:8080" dist/; then
            echo "::error::dist/ contains localhost:8080 — refusing to deploy"
            exit 1
          fi

      - name: Require the deploy role variable
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::repo variable AWS_DEPLOY_ROLE_ARN is not set"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes so caching can differ by file:
      # 1) everything except index.html (content-hashed assets/) is long-cached
      #    and immutable; uploaded first and without --delete, so the new
      #    index.html never points at assets that aren't there yet.
      # 2) index.html with no-cache, plus --delete to prune stale hashed assets
      #    under admin/. Files pass 1 just uploaded are skipped by pass 2.
      - name: Sync hashed assets (long cache)
        run: >
          aws s3 sync dist/ "s3://${S3_BUCKET}/admin/"
          --exclude index.html
          --cache-control "public, max-age=31536000, immutable"

      - name: Sync index.html (no-cache) and prune stale files
        run: >
          aws s3 sync dist/ "s3://${S3_BUCKET}/admin/"
          --delete
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/admin/*"

      # CloudFront invalidations take tens of seconds, so the edge may still
      # serve the previous index.html for a while. Retry until every
      # /admin/assets/ reference in the served page exists in this build, or
      # fail after a ~3 minute deadline.
      - name: Smoke test https://erfeamor.com/admin/
        run: |
          deadline=$((SECONDS + 180))
          status=000
          bad=""
          while true; do
            status=$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' -o served.html -w '%{http_code}' \
              https://erfeamor.com/admin/ || true)
            bad=""
            if [ "$status" = "200" ]; then
              refs=$(grep -oE '/admin/assets/[^"]+' served.html | sort -u)
              if [ -z "$refs" ]; then
                bad="(no /admin/assets/ references in served index.html)"
              fi
              for a in $refs; do
                if [ ! -f "dist/assets/${a#/admin/assets/}" ]; then
                  bad="$bad $a"
                fi
              done
              if [ -z "$bad" ]; then
                echo "OK: served index.html matches the build"
                exit 0
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::deadline passed; last HTTP status $status; served refs not in this build:$bad"
              exit 1
            fi
            echo "Edge not updated yet (status $status), retrying in 10s"
            sleep 10
          done
